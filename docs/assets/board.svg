<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" role="img" aria-label="A taskwing run in the terminal: the plan step with the pieces and the exam, the approval question, and the live board with one line per agent">
  <title>taskwing run in the terminal</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #d7def0; white-space: pre; }
    .dim { fill: #7d89a8; }
    .b { font-weight: 700; fill: #ffffff; }
    .blue { fill: #4f8bff; }
    .grey { fill: #6b7590; }
    .red { fill: #ff6b63; }
    .green { fill: #3fcf93; }
    .prompt { fill: #9ab7f9; }
  </style>
  <rect width="880" height="516" rx="14" fill="#0b1020"/>
  <rect width="880" height="36" rx="14" fill="#151c33"/>
  <rect y="22" width="880" height="14" fill="#151c33"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="440" y="23" text-anchor="middle" class="dim" style="font-size:12px">taskwing</text>

  <text x="24" y="68"><tspan class="prompt">$</tspan> taskwing run "Add CSV export to the orders page"</text>

  <text x="24" y="102" class="b">1/4 Plan</text>
  <text x="24" y="124" class="dim">  The lead agent is splitting the task. A separate session is writing the exam.</text>

  <text x="24" y="158">  <tspan class="b">The plan</tspan></text>
  <text x="24" y="180">  01 CSV encoder and tests  <tspan class="dim">internal/export/csv.go, internal/export/csv_test.go</tspan></text>
  <text x="24" y="202">  02 Export endpoint  <tspan class="dim">api/orders_export.go</tspan></text>
  <text x="24" y="224">  03 Export button on orders  <tspan class="dim">web/orders/ExportButton.tsx</tspan></text>

  <text x="24" y="258">  <tspan class="b">The exam</tspan><tspan class="dim">  (written by a separate session; the agents never see it)</tspan></text>
  <text x="24" y="280">  1. The orders page has an Export CSV button</text>
  <text x="24" y="302">  2. GET /orders/export returns every order as CSV, one row each</text>

  <text x="24" y="336">Start 3 agents in boat sandboxes? This is the exam they must pass.</text>
  <text x="24" y="358" class="dim">y start · n stop · r new plan · or type a check of your own</text>
  <text x="24" y="380"><tspan class="prompt">&gt;</tspan> <tspan class="green">y</tspan></text>

  <text x="24" y="414" class="b">2/4 Build <tspan class="dim" style="font-weight:400">  2m41s · e + Enter runs the exam now</tspan></text>
  <text x="24" y="444">  01 <tspan class="grey">■</tspan> CSV encoder and tests      <tspan class="dim">encoder done, 9 tests pass</tspan></text>
  <text x="24" y="466">  02 <tspan class="blue">▣</tspan> Export endpoint            <tspan class="dim">wiring GET /orders/export</tspan></text>
  <text x="24" y="488">  03 <tspan class="blue">▣</tspan> Export button on orders    <tspan class="dim">reading its piece</tspan></text>

</svg>

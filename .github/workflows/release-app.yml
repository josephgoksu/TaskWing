name: Release desktop app

# Push a tag app-vX.Y.Z to build every platform and open a draft release.
# Run it by hand to build every platform without a release; the builds land
# as workflow artifacts.

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#app-v}"
          pkg="$(node -p "require('./app/package.json').version")"
          conf="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          # Windows checks out with CRLF, so match up to the closing quote, not the line end.
          crate="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' app/src-tauri/Cargo.toml | head -n 1)"
          echo "tag $want, package.json $pkg, tauri.conf.json $conf, Cargo.toml $crate"
          if [ "$pkg" != "$want" ] || [ "$conf" != "$want" ] || [ "$crate" != "$want" ]; then
            echo "::error::Set version $want in app/package.json, app/src-tauri/tauri.conf.json and app/src-tauri/Cargo.toml before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # A cache saved under a tag is never read again (each tag is its own
      # cache scope), so only a manual run on main saves one for later tags.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # With the APPLE_* secrets set, the Mac build is signed with the
      # Developer ID and notarised. Without them it is ad hoc signed, which
      # Apple silicon needs to open it at all.
      - name: Mac signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice::No Apple certificate is set, so the Mac build is ad hoc signed and not notarised."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            delim="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "$value" "$delim" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: TaskWing desktop __VERSION__
          releaseBody: Desktop builds of TaskWing for macOS, Linux and Windows. The app runs on its demo engine until the TaskWing engine stream lands.
          releaseDraft: true
          prerelease: true
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}

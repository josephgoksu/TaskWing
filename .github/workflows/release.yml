name: Release CLI

# Push a tag vX.Y.Z (or vX.Y.Z-alpha.N) to build the taskwing engine and CLI
# for macOS, Linux and Windows, publish a GitHub release with Linux packages,
# and update the Homebrew formula in josephgoksu/homebrew-tap.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # build provenance: sign the attestation
  attestations: write # build provenance: store it with the repository

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs the previous tag
      # Releases build on the latest Go for its security fixes; CI tests the
      # minimum in go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # Tests run here, without the release tokens; GoReleaser below holds them.
      - name: Test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents: write on josephgoksu/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Signed build provenance for every archive and package, so users can
      # check a download came from this workflow: gh attestation verify <file> -R josephgoksu/TaskWing
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

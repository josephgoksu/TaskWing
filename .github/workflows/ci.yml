name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "::error::Run gofmt on these files:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /dev/null ./cmd/taskwing

  # Builds every archive and package from .goreleaser.yaml without publishing,
  # so a broken release config fails here and not halfway through a tagged release.
  release-config:
    name: Release config (GoReleaser snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The snapshot below skips publishing, so it never applies token templates.
      # GoReleaser accepts only a bare {{ .Env.NAME }} there; anything else
      # fails a tagged release after the GitHub release is already public.
      # Every token: key (block or flow style, not in a comment) must be
      # exactly token: '{{ .Env.NAME }}'. A missing config fails the check.
      - name: Token templates are bare env references
        run: |
          cfg=.goreleaser.yaml
          test -f "$cfg" || { echo "::error::$cfg not found: point this check at the GoReleaser config"; exit 1; }
          good="^[0-9]+:token: '\{\{ \.Env\.[A-Za-z_][A-Za-z0-9_]* \}\}'[[:space:]]*(#.*)?$"
          bad="$(grep -nE '(^|[[:space:]{,])token:' "$cfg" | sed -E 's/^([0-9]+):[[:space:]]*/\1:/' | grep -vE '^[0-9]+:#' | grep -vE "$good" || true)"
          if [ -n "$bad" ]; then
            while IFS= read -r l; do
              echo "::error file=$cfg,line=${l%%:*}::token must be '{{ .Env.NAME }}' only, got: ${l#*:}"
            done <<< "$bad"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish


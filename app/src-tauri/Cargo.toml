[package]
name = "taskwing-app"
version = "0.1.0"
description = "TaskWing desktop app"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "taskwing_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

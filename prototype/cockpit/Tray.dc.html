<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TaskWing menu bar popover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8AB8FF}a:hover{color:#B4D2FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 480px; box-sizing: border-box; padding: 16px; background: #0F1114; border-radius: 12px; border: 1px solid #2A2F37; color: #E8EAED; font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1.4; display: flex; flex-direction: column; gap: 12px">
<div>
<div style="font-size: 12px; color: #9AA3AF">TaskWing · 3 runs · 19 boxes</div>
<h1 style="margin: 2px 0 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700; color: #F5B041">4 things need you.</h1>
</div>

<div style="background: #1C1A14; border: 1px solid #5A4212; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 600; color: #F5B041">brief.finance · box 03</div>
<div style="font-size: 14px; font-weight: 600">Cap an export at 50,000 rows, or stream everything?</div>
<div style="display: flex; gap: 6px">
<button style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #F5B041; background: #F5B041; color: #1A1300; font-size: 13px; font-weight: 600">Cap at 50k</button>
<button style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #5A4212; background: transparent; color: #E8EAED; font-size: 13px; font-weight: 600">Stream all</button>
</div>
</div>

<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid #262B33">
<div style="min-width: 0"><div style="font-weight: 600">brief.finance</div><div style="font-size: 12px; color: #9AA3AF">Build · finishes near 16:50</div></div>
<span style="align-self: center; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #F5B041; color: #1A1300">3</span>
</div>
<div style="display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid #262B33">
<div style="min-width: 0"><div style="font-weight: 600">motif</div><div style="font-size: 12px; color: #9AA3AF">Review · 1 issue found</div></div>
<span style="align-self: center; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #F5B041; color: #1A1300">1</span>
</div>
<div style="display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid #262B33">
<div style="min-width: 0"><div style="font-weight: 600">markwise-app</div><div style="font-size: 12px; color: #9AA3AF">Build · just started</div></div>
<span style="align-self: center; font-size: 12px; color: #8AB8FF">on track</span>
</div>
</div>

<div style="margin-top: auto; display: flex; gap: 6px">
<button style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #3A414C; background: transparent; color: #E8EAED; font-size: 13px">Open TaskWing</button>
<button style="flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #3A414C; background: transparent; color: #E8EAED; font-size: 13px">New run</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
